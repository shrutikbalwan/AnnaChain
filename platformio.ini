; AnnaChain — sensor node firmware
; SIH 2026 · PS 26232 · MoFPI · Hardware
;
;   pio run -e native -t exec     run the whole demo on your laptop, no hardware
;   pio test -e native            run the unit tests
;   pio run -e node_mock -t upload  flash an ESP32-S3, fake sensor data
;   pio run -e node -t upload       flash an ESP32-S3, real SHT40
;
; Everything in lib/core is plain C++ with no Arduino in it, which is why the
; same code runs on your laptop and on the board.

[platformio]
default_envs = native

; ─────────────────────────── shared ───────────────────────────
[env]
build_flags =
    -std=gnu++17
    -Wall
build_unflags = -std=gnu++11

; ─────────── laptop simulation — start here, today ───────────
[env:native]
platform  = native
test_framework = unity
build_src_filter = +<../native/*>
build_flags =
    ${env.build_flags}
    -DSH_NATIVE=1
    -DSH_LOG_CAPACITY=4096

; ─────────── ESP32-S3, fake sensors (no parts needed) ───────────
[env:node_mock]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_src_filter = +<main.cpp>
build_flags =
    ${env.build_flags}
    -DSH_MOCK_SENSORS=1
    -DSH_LOG_CAPACITY=4096
    -DCORE_DEBUG_LEVEL=1

; ─────────── ESP32-S3, real SHT40 ───────────
[env:node]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_src_filter = +<main.cpp>
build_flags =
    ${env.build_flags}
    -DSH_LOG_CAPACITY=4096
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    adafruit/Adafruit SHT4x Library @ ^1.0.5
    adafruit/Adafruit BusIO @ ^1.16.1

; ─────────── ESP32-S3 in the truck cab: the gateway ───────────
; One per truck. Collects from the crate nodes over LoRa, buffers, forwards.
; The SX1262 driver is stubbed until the module arrives — see src/gateway.cpp.
[env:gateway]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_src_filter = +<gateway.cpp>
build_flags =
    ${env.build_flags}
    -DAC_LOG_CAPACITY=4096
    -DCORE_DEBUG_LEVEL=1
; when the module is on the bench:
; lib_deps = jgromes/RadioLib @ ^7.1.0
