; AnnaChain — node and gateway firmware
; SIH 2026 · PS 26232 · MoFPI · Hardware
;
;   pio run -e native                 build the laptop demo (same as `make demo`)
;   pio run -e node_mock -t upload    ESP32-S3, fake sensors, USB serial link   — no parts needed
;   pio run -e node      -t upload    ESP32-S3 + SHT40, USB serial link
;   pio run -e node_lora -t upload    ESP32-S3 + SHT40 + SX1262 + PN532: the field node
;   pio run -e gateway   -t upload    ESP32-S3 + SX1262, Wi-Fi uplink + NTP: the truck cab
;   pio run -e smoke     -t upload    arrival day: probe every part, one line each
;
; No ESP32 environment here has ever been compiled successfully, and none has
; run on a board, because none has arrived. docs/HIL.md is the arrival-day order.
; The drivers that need a part (SX1262, ATECC608B, PN532,
; Wi-Fi/NTP) are marked UNPROVEN in their headers and in backend/README.md.
;
; The firmware tests are not run through `pio test`: tools/selftest.cpp is the
; suite (`make firmware-test`), and it builds with plain g++.
;
; Wi-Fi settings come from the environment at build time, never from source:
;   AC_WIFI_SSID, AC_WIFI_PASS, AC_SERVER_URL (e.g. http://192.168.1.14:8000)
; Left unset, the gateway falls back to the USB serial uplink.

[platformio]
default_envs = native

; ─────────────────────────── shared ───────────────────────────
[env]
build_flags =
    -std=gnu++17
    -Wall
build_unflags = -std=gnu++11

; The board: ESP32-S3-DevKitC-1 with the ESP32-S3-WROOM-1-N16R8 module.
; N16R8 = 16 MB quad-SPI flash + 8 MB OCTAL-SPI PSRAM (Espressif's DevKitC-1
; ordering table lists the same split, flash QD / PSRAM OT, for N8R8). Hence:
;   memory_type qio_opi  — quad flash, octal PSRAM. The default (qio_qspi)
;                          gets PSRAM wrong on this module.
;   flash_size 16MB and the 16 MB partition table, or 8 MB of flash is wasted
;   and the LittleFS log gets the default small partition.
; Octal PSRAM also takes GPIO33-37; see lib/ac/ac_pins.h.
[esp32s3]
platform  = espressif32 @ 7.1.3
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions  = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.filesystem  = littlefs
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DAC_LOG_CAPACITY=4096
    -DCORE_DEBUG_LEVEL=1
    -DAC_WIFI_SSID=\"${sysenv.AC_WIFI_SSID}\"
    -DAC_WIFI_PASS=\"${sysenv.AC_WIFI_PASS}\"
    -DAC_SERVER_URL=\"${sysenv.AC_SERVER_URL}\"

[libs]
sht40  = adafruit/Adafruit SHT4x Library @ ^1.0.5
         adafruit/Adafruit BusIO @ ^1.16.1
lora   = jgromes/RadioLib @ ^7.1.0
nfc    = adafruit/Adafruit PN532 @ ^1.3.3
atecc  = arduino-libraries/ArduinoECCX08 @ ^1.3.8

; ─────────── laptop simulation — start here, today ───────────
[env:native]
platform  = native
build_src_filter = +<../native/*>
build_flags =
    ${env.build_flags}
    -DAC_NATIVE=1
    -DAC_LOG_CAPACITY=4096

; ─────────── ESP32-S3, fake sensors (no parts needed) ───────────
[env:node_mock]
extends = esp32s3
build_src_filter = +<main.cpp>
build_flags =
    ${esp32s3.build_flags}
    -DAC_MOCK_SENSORS=1

; ─────────── ESP32-S3, real SHT40, USB serial link ───────────
[env:node]
extends = esp32s3
build_src_filter = +<main.cpp>
lib_deps =
    ${libs.sht40}

; ─────────── the field node: SHT40, SX1262 to the gateway, PN532 ───────────
; ECDSA on the ATECC608B is not in here yet: records still carry the 32-byte
; HMAC. See lib/ac/ac_hal.h (IEcdsaSigner) and docs/HIL.md step 4.
[env:node_lora]
extends = esp32s3
build_src_filter = +<main.cpp>
build_flags =
    ${esp32s3.build_flags}
    -DAC_LINK_LORA=1
    -DAC_NFC=1
lib_deps =
    ${libs.sht40}
    ${libs.lora}
    ${libs.nfc}

; ─────────── ESP32-S3 in the truck cab: the gateway ───────────
[env:gateway]
extends = esp32s3
build_src_filter = +<gateway.cpp>
lib_deps =
    ${libs.lora}

; ─────────── arrival day: probe every part ───────────
[env:smoke]
extends = esp32s3
build_src_filter = +<smoke.cpp>
lib_deps =
    ${libs.sht40}
    ${libs.lora}
    ${libs.nfc}
    ${libs.atecc}
