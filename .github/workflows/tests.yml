# Both suites on every push and pull request: the firmware selftest (plain g++)
# and the backend pytest suite. `make test` is exactly what runs on a laptop.
#
# On these runners there is no Playwright/Chrome, so the browser tests in
# backend/tests/test_trace_page_browser.py skip (as one skipped module); the
# gateway end-to-end test runs, because g++ is here. A skip is not a failure;
# a failure is.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the backend's dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: make test (firmware selftest + backend suite)
        run: make test PY=python
      - name: make demo (must print DEMO PASSED)
        run: make demo | tee demo.log && grep -q "DEMO PASSED" demo.log

  # The demo laptop is Windows, and the README's commands are mingw32-make from
  # PowerShell or cmd. There, make runs recipes through cmd.exe: no rm, no ./ —
  # unless an sh.exe is on PATH, in which case make quietly uses it and every
  # Unix-ism works. GitHub's Windows runners put Git's sh.exe on PATH, which
  # would hide exactly the bugs this job exists to catch, so the first step
  # takes every Git/MSYS directory off PATH and proves no sh.exe is left.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the backend's dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: PATH as on the laptop (cmd.exe runs make's recipes, no sh.exe)
        run: |
          $keep = $env:Path -split ';' | Where-Object { $_ -and $_ -notmatch '\\Git\\(usr\\)?bin|\\Git\\mingw64\\bin|msys' }
          $mingw = Get-ChildItem 'C:\mingw64\bin\mingw32-make.exe', 'C:\ProgramData\mingw64\mingw64\bin\mingw32-make.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $mingw) { choco install mingw -y --no-progress; $mingw = Get-ChildItem 'C:\ProgramData\mingw64\mingw64\bin\mingw32-make.exe' }
          $path = ($keep + $mingw.DirectoryName) -join ';'
          $env:Path = $path
          if (Get-Command sh -ErrorAction SilentlyContinue) { throw "sh.exe still on PATH: $((Get-Command sh).Source)" }
          mingw32-make --version | Select-Object -First 1
          g++ --version | Select-Object -First 1
          "PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: mingw32-make clean
        run: |
          if (Get-Command sh -ErrorAction SilentlyContinue) { throw "sh.exe on PATH" }
          mingw32-make PY=python clean
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: mingw32-make fleet (and the capture it writes)
        run: |
          mingw32-make PY=python fleet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $b = [IO.File]::ReadAllBytes("fleet.capture")
          if ($b[0] -eq 0xEF -or $b[0] -eq 0xFF -or $b[0] -eq 0xFE) { throw "fleet.capture starts with a BOM" }
          $first = (Get-Content fleet.capture -TotalCount 1)
          if ($first -notmatch '^K 639836161 [0-9a-f]+$') { throw "first line is not 'K 639836161 <hex>': $first" }
          $n = (Select-String -Path fleet.capture -Pattern '^R ').Count
          if ($n -ne 1260) { throw "expected 1260 R lines, got $n" }
          "first line ok, $n records"
      - name: mingw32-make firmware-test
        run: |
          mingw32-make PY=python firmware-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: mingw32-make demo (must print DEMO PASSED)
        run: |
          $out = mingw32-make PY=python demo | Out-String
          $out
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($out -notmatch 'DEMO PASSED') { throw "no DEMO PASSED" }
      - name: backend suite
        run: |
          python -m pytest backend/tests -q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
